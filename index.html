<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scriptie · kick-start</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Iowan+Old+Style&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">scriptie</span>
    </div>
    <div class="progress">
      <span class="progress-text" id="progress-text">0 / 30</span>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </header>

  <main>
    <article class="card" id="day-card">
      <header class="card-head">
        <span class="day-tag" id="day-tag">DAG —</span>
        <span class="day-date" id="day-date">—</span>
      </header>

      <h1 class="day-topic" id="day-topic">—</h1>

      <section class="day-source" id="day-source">
        <span class="kicker">vandaag lees / luister je</span>
        <a class="source-link" id="source-link" href="#" target="_blank" rel="noopener">—</a>
        <p class="source-meta" id="source-meta"></p>
      </section>

      <section class="day-question">
        <span class="kicker">vraag voor jezelf</span>
        <p id="day-question-text">—</p>
      </section>

      <section class="day-note">
        <span class="kicker">één regel voor jezelf <span class="muted small">(optioneel)</span></span>
        <textarea
          id="day-note"
          rows="2"
          placeholder="één gedachte, één zin — als er iets blijft hangen"
        ></textarea>
      </section>

      <footer class="card-actions">
        <button class="btn-primary" id="btn-done">klaar voor vandaag ✓</button>
        <span class="muted small" id="done-state"></span>
      </footer>
    </article>

    <nav class="day-nav">
      <button class="nav-btn" id="btn-prev">← vorige</button>
      <button class="nav-btn" id="btn-jump-today">vandaag</button>
      <button class="nav-btn" id="btn-next">volgende →</button>
    </nav>

    <div class="day-grid" id="day-grid"></div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
