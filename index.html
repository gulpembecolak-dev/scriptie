<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scriptie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="workspace">

    <!-- ============ LEFT: Claude Code-style chat ============ -->
    <aside class="left-panel" id="left-panel">
      <header class="cc-header">
        <div class="cc-logo">
          <span class="cc-mark">▗ ▗   ▖ ▖</span>
          <span class="cc-mark">▘▘ ▝▝</span>
        </div>
        <div class="cc-title">
          <div>Claude Code</div>
          <div class="cc-sub">scriptie · /Users/admin</div>
        </div>
      </header>

      <div class="cc-stream" id="cc-stream">
        <div class="cc-welcome">
          <p>Welcome to scriptie.</p>
          <p class="cc-muted">Hier komt je gesprek met Claude. Typ hieronder of plak een eerder gesprek.</p>
        </div>
      </div>

      <form class="cc-input-area" id="cc-form" autocomplete="off">
        <span class="cc-prompt">❯</span>
        <textarea
          id="cc-input"
          rows="1"
          placeholder="schrijf je gedachte… ⏎ om te versturen, shift+⏎ voor nieuwe regel"
        ></textarea>
      </form>
    </aside>

    <!-- ============ RIGHT: bare placeholder for now ============ -->
    <main class="right-panel">
      <div class="right-placeholder">
        <p class="right-kicker">scriptie</p>
        <p class="right-muted">hier komen je notities</p>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
